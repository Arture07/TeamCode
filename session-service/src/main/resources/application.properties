# A porta interna do serviço
server.port=8080

# O Spring vai pegar nas credenciais das vari�veis de ambiente do Docker
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Avoid Postgres LOB auto-commit issues
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# A chave secreta para os tokens JWT (tambm vir do Docker)
jwt.secret=${JWT_SECRET}

# Gemini API Key
gemini.api.key=${GEMINI_API_KEY}
# Gemini Model (default to gemini-3.7-flash)
gemini.model=${GEMINI_MODEL:gemini-3.7-flash}
# Gemini Fallback Models (activated automatically when primary model experiences high demand or rate limits)
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.6-flash,gemini-flash-lite-latest,gemini-2.5-flash,gemini-2.0-flash}

# CORS — Allowed Origin Patterns (separated by comma, default to *)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}