x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres-db:
    image: postgres:14-alpine
    container_name: teamcode-postgres
    logging: *default-logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - teamcode-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamcode_user -d teamcode_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamcode-redis
    logging: *default-logging
    # Security: Redis with password authentication and no external port exposure
    command: redis-server --requirepass ${REDIS_PASSWORD:-teamcode_redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - teamcode-net
    restart: unless-stopped

  user-service:
    image: ghcr.io/arture07/teamcode-user-service:latest
    build: ./user-service
    container_name: teamcode-user-service
    logging: *default-logging
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:-*}
      - TZ=America/Sao_Paulo
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    expose:
      - "8080"
    networks:
      - teamcode-net
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  session-service:
    image: ghcr.io/arture07/teamcode-session-service:latest
    build: ./session-service
    container_name: teamcode-session-service
    logging: *default-logging
    expose:
      - "8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - GEMINI_FALLBACK_MODELS=${GEMINI_FALLBACK_MODELS:-gemini-3.6-flash,gemini-flash-lite-latest,gemini-2.5-flash,gemini-2.0-flash}
      - CORS_ALLOWED_ORIGIN_PATTERNS=${CORS_ALLOWED_ORIGIN_PATTERNS:-*}
      - TZ=America/Sao_Paulo
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    networks:
      - teamcode-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  sync-service:
    image: ghcr.io/arture07/teamcode-sync-service:latest
    build: ./sync-service
    container_name: teamcode-sync-service
    logging: *default-logging
    # Security: only expose the minimum ports needed for live preview
    ports:
      - "3000-3005:3000-3005"
      - "5000-5005:5000-5005"
      - "8000-8005:8000-8005"
    expose:
      - "8082"
    networks:
      - teamcode-net
    volumes:
      - session-data:/tmp
    environment:
      - TZ=America/Sao_Paulo
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-teamcode_redis_pass}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8082/ping > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  frontend:
    image: ghcr.io/arture07/teamcode-frontend:latest
    build: ./frontend
    container_name: teamcode-frontend
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      user-service:
        condition: service_healthy
      session-service:
        condition: service_healthy
      sync-service:
        condition: service_healthy
    volumes:
      - session-data:/usr/share/nginx/html/preview
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - teamcode-net
    restart: unless-stopped

networks:
  teamcode-net:
    driver: bridge

volumes:
  postgres-data:
  session-data:
