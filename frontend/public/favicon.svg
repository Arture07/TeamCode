<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bracketLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bracketRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container with Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="20"/>

  <!-- Inner Soft Glow Grid -->
  <circle cx="256" cy="256" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="100" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Angle Bracket < -->
  <path d="M 180 150 L 88 256 L 180 362" fill="none" stroke="url(#bracketLeftGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right Angle Bracket > -->
  <path d="M 332 150 L 424 256 L 332 362" fill="none" stroke="url(#bracketRightGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Central Dynamic Slash / Connected Sync Nodes -->
  <path d="M 286 142 L 226 370" fill="none" stroke="url(#boltGrad)" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Central Pulse Dots -->
  <circle cx="286" cy="142" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="226" cy="370" r="14" fill="#f59e0b"/>
</svg>
