events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security: hide Nginx version
    server_tokens off;

    # Security: Rate limiting zones
    # General API: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    # Auth endpoints: 3 requests/second per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=3r/s;
    # AI endpoints: 5 requests/second per IP (protect Gemini API quota)
    limit_req_zone $binary_remote_addr zone=api_ai:10m rate=5r/s;

    # Security: limit request body size (uploads)
    client_max_body_size 10m;

    # Security: timeouts to prevent slow loris attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Servidor HTTP (porta 80) - para localhost e conexões HTTP diretas
    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: http: https: https://cdn.jsdelivr.net https://unpkg.com; frame-src 'self' blob: http: https: https://accounts.google.com; worker-src 'self' blob: https://cdn.jsdelivr.net https://unpkg.com;" always;

        # Frontend estático
        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Dynamic Port Forwarding for terminal web servers (Node.js, Python, Go, etc.)
        location ~ ^/port/(\d+)(/.*)?$ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $target_port $1;
            set $target_path $2;
            if ($target_path = '') {
                set $target_path '/';
            }
            proxy_pass http://sync-service:$target_port$target_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Live Preview (Arquivos da Sessão)
        location /preview/ {
            alias /usr/share/nginx/html/preview/;
            index index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }

        # API REST -> Session Service
        location /api/sessions {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://session-service:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # API REST Tree -> Session Service
        location /api/tree {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://session-service:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # API REST AI -> Session Service
        location /api/ai {
            limit_req zone=api_ai burst=5 nodelay;
            proxy_pass http://session-service:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # API REST -> User Service
        location /api/users {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://user-service:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # API REST Git -> Sync Service
        location /api/git {
            limit_req zone=api_general burst=10 nodelay;
            proxy_pass http://sync-service:8082;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # WebSocket / SockJS -> Sync Service
        location ^~ /ws-connect {
            proxy_pass http://sync-service:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Força JS modules
        location ~* \.(js|mjs)$ {
            root /usr/share/nginx/html;
            add_header Content-Type application/javascript;
            try_files $uri =404;
        }

        # Outros estáticos
        location ~* \.(css|png|jpg|jpeg|gif|svg|ico)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Security: block access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        # Security: custom error pages
        error_page 429 /429.html;
        location = /429.html {
            root /usr/share/nginx/html;
            internal;
            default_type text/html;
            return 429 '<!DOCTYPE html><html><head><title>Muitas requisições</title></head><body><h1>429 - Muitas Requisições</h1><p>Você está fazendo requisições muito rápido. Aguarde um momento e tente novamente.</p></body></html>';
        }
    }

    # Servidor HTTPS principal
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: http: https: https://cdn.jsdelivr.net https://unpkg.com; frame-src 'self' blob: http: https: https://accounts.google.com; worker-src 'self' blob: https://cdn.jsdelivr.net https://unpkg.com;" always;

        # Frontend estático
        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Dynamic Port Forwarding for terminal web servers (Node.js, Python, Go, etc.)
        location ~ ^/port/(\d+)(/.*)?$ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $target_port $1;
            set $target_path $2;
            if ($target_path = '') {
                set $target_path '/';
            }
            proxy_pass http://sync-service:$target_port$target_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Live Preview (Arquivos da Sessão)
        location /preview/ {
            alias /usr/share/nginx/html/preview/;
            index index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }

        # API REST -> Session Service (rate limited)
        location /api/sessions {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://session-service:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # API REST Tree -> Session Service (rate limited)
        location /api/tree {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://session-service:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # API REST AI -> Session Service (stricter rate limit)
        location /api/ai {
            limit_req zone=api_ai burst=5 nodelay;
            proxy_pass http://session-service:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # API REST -> User Service (auth endpoints with strict rate limit)
        location /api/users {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://user-service:8080;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # API REST Git -> Sync Service (rate limited)
        location /api/git {
            limit_req zone=api_general burst=10 nodelay;
            proxy_pass http://sync-service:8082;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # WebSocket / SockJS -> Sync Service
        location ^~ /ws-connect {
            proxy_pass http://sync-service:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Força JS modules
        location ~* \.(js|mjs)$ {
            root /usr/share/nginx/html;
            add_header Content-Type application/javascript;
            try_files $uri =404;
        }

        # Outros estáticos
        location ~* \.(css|png|jpg|jpeg|gif|svg|ico)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Security: block access to hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        # Security: custom error pages to avoid leaking Nginx info
        error_page 429 /429.html;
        location = /429.html {
            root /usr/share/nginx/html;
            internal;
            default_type text/html;
            return 429 '<!DOCTYPE html><html><head><title>Muitas requisições</title></head><body><h1>429 - Muitas Requisições</h1><p>Você está fazendo requisições muito rápido. Aguarde um momento e tente novamente.</p></body></html>';
        }
    }
}
